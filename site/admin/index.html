<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff7f0">
  <title>لوحة التحكم — مطعم النيران</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <main class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm">
      <img src="/img/logo-mark.webp" alt="" class="login-logo">
      <h1>لوحة تحكم المنيو</h1>
      <p class="muted">مطعم النيران</p>
      <label class="field">
        <span>كلمة المرور</span>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="loginError" hidden></p>
      <button class="btn primary big" type="submit" id="loginBtn">دخول</button>
    </form>
  </main>

  <!-- Not configured / loading messages -->
  <main class="login" id="msgView" hidden>
    <div class="login-card">
      <img src="/img/logo-mark.webp" alt="" class="login-logo">
      <h1 id="msgTitle">جاري التحميل…</h1>
      <p class="muted" id="msgText"></p>
    </div>
  </main>

  <!-- App -->
  <div class="app" id="appView" hidden>
    <header class="topbar">
      <div class="brand"><img src="/img/logo-mark.webp" alt=""><div><b>لوحة التحكم</b><small id="lastSaved">—</small></div></div>
      <div class="top-actions">
        <a class="btn ghost" href="/" target="_blank" rel="noopener">عرض المنيو ↗</a>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="items" class="active"><span class="ti">🍽️</span><span>الأصناف</span></button>
      <button data-tab="offers"><span class="ti">🔥</span><span>العروض</span></button>
      <button data-tab="cats"><span class="ti">📂</span><span>الأقسام</span></button>
      <button data-tab="settings"><span class="ti">⚙️</span><span>الإعدادات</span></button>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">جاري الحفظ…</span></div>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
